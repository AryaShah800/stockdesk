# GitHub Actions: build and test StockDesk on every push and pull request.
# Windows, because the integration tests create throwaway databases on SQL Server LocalDB.
# Deployment is not part of this workflow.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Start SQL Server LocalDB
        shell: pwsh
        run: |
          $instances = sqllocaldb info
          if ($instances -notcontains 'MSSQLLocalDB') { sqllocaldb create MSSQLLocalDB }
          sqllocaldb start MSSQLLocalDB
          sqllocaldb info MSSQLLocalDB

      - name: Restore
        run: dotnet restore StockDesk.sln

      - name: Build (warnings are errors)
        run: dotnet build StockDesk.sln --no-restore -c Release

      - name: Fail on vulnerable packages
        shell: pwsh
        run: |
          $report = dotnet list StockDesk.sln package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $report
          if ($report -match 'has the following vulnerable packages') {
            Write-Error 'A package with a known vulnerability is in use. See the list above.'
            exit 1
          }

      - name: Unit and integration tests
        run: dotnet test StockDesk.sln --no-build -c Release --logger trx --results-directory TestResults --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  docker-image:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compose file fails fast without .env
        run: |
          if docker compose config >/dev/null 2>err.txt; then echo "expected failure"; exit 1; fi
          grep -q "missing .env" err.txt
      - name: Compose file is valid with .env.example
        run: cp .env.example .env && docker compose config >/dev/null
      - name: Build image (no push)
        run: docker build -t stockdesk-web:ci .
