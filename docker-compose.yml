# One command: docker compose up --build   (needs .env: cp .env.example .env)
# App: http://localhost:8089
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?missing .env - copy .env.example to .env and set the values}
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8089}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Https__RedirectDisabled: "true"
      Database__MigrateOnStartup: "true"
      Seed__DemoData: "true"
      ConnectionStrings__StockDesk: Server=db;Database=StockDesk;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL:?missing .env - copy .env.example to .env and set the values}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:?missing .env - copy .env.example to .env and set the values}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080 && printf \"GET /Account/Login HTTP/1.0\r\n\r\n\" >&3 && head -1 <&3 | grep -q 200'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  sqldata:
